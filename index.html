<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ET Quiz – 23 Nov 2026</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#1b1b1b;--mut:#6b6558;--line:#e2dccd;--acc:#b3122a;--ok:#1f8a4c;--bad:#c62828;--amb:#d98300}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:3px double var(--ink)}
h1{margin:0;font-size:1.3rem}h1 span{color:var(--acc)}
nav button,.btn{font:inherit;font-family:system-ui,sans-serif;font-size:.9rem;padding:8px 14px;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
nav button.on,.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
main{max-width:1000px;margin:0 auto;padding:16px}
#dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
#dots button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 .8rem system-ui;cursor:pointer}
#dots button.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#dots button.c{background:var(--ok);color:#fff;border-color:var(--ok)}#dots button.w{background:var(--bad);color:#fff;border-color:var(--bad)}#dots button.u{background:var(--mut);color:#fff;border-color:var(--mut)}
.slide{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
.meta{display:flex;flex-wrap:wrap;gap:8px;font:600 .85rem system-ui;color:var(--mut);margin-bottom:14px}
.pill{padding:3px 10px;border-radius:99px;border:1px solid var(--line)}.pill.who{background:var(--acc);color:#fff;border-color:var(--acc)}
.q{font-size:clamp(1.3rem,3vw,2rem);line-height:1.35;margin:0 0 20px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;font-size:clamp(1.05rem,2.2vw,1.4rem);padding:14px 16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
.opt b{width:32px;height:32px;flex:none;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 .95rem system-ui}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}.opt.picked{outline:3px solid var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:20px}
.timer{display:flex;align-items:center;gap:14px}
#clock{width:84px;height:84px;border-radius:50%;border:6px solid var(--line);display:grid;place-items:center;font:700 2.2rem system-ui}
#clock.read{border-color:var(--amb);color:var(--amb)}#clock.ans{border-color:var(--ok);color:var(--ok)}#clock.end{border-color:var(--bad);color:var(--bad)}
#phase{font:700 1rem system-ui;text-transform:uppercase;letter-spacing:.06em}
.res{font:700 1rem system-ui}
table{width:100%;border-collapse:collapse;font-family:system-ui;font-size:.92rem}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
.grp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}.grp h2{margin:0 0 8px;display:flex;justify-content:space-between}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.ed{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;font-family:system-ui}
.ed input[type=text],.ed textarea{width:100%;font:inherit;padding:7px;margin:3px 0;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.ed label{display:flex;gap:8px;align-items:center}
.hide{display:none}
</style></head><body>
<header><h1>The <span>Economic Times</span> Quiz · 23 Nov 2026</h1>
<nav><button id="tQ" class="on">Quiz</button> <button id="tS">Scorecard</button> <button id="tE">Edit Questions</button></nav></header>
<main>
<section id="vQ"><div id="dots"></div><div class="slide" id="slide"></div></section>
<section id="vS" class="hide"></section>
<section id="vE" class="hide"></section>
</main>
<script>
const GROUPS=[["Group 1",["Manish","Manav","Rudra"]],["Group 2",["Anuj","Vishrut","Sujal"]],["Group 3",["Akshat","Ria","Abheetha"]]];
// Order: for each member -> 1 Politics/International, then 1 Business (6 per group, 18 total)
const DEFAULT_Q=[
["Which leader arrived in India on his maiden bilateral trip abroad as Nepal's Prime Minister?",["KP Sharma Oli","Balen Shah","Pushpa Kamal Dahal","Sher Bahadur Deuba"],1],
["Mahindra Financial is evaluating the acquisition of which type of companies?",["Gold finance companies","Insurance firms","Housing finance companies","Fintech startups"],0],
["Where in Delhi was the inaugural SCO Civilisational Forum held?",["Red Fort","India Gate","Purana Quila","Humayun's Tomb"],2],
["Tata Play is in talks to sell its broadband business to which company?",["Bharti Airtel","Atria Convergence Technologies (ACT)","Jio Fiber","Hathway"],1],
["Under the long-term power trade agreement, how much power may India import from Nepal over 10 years?",["1,200 MW","5,000 MW","15,000 MW","10,000 MW"],3],
["How much is Tata Play seeking for its broadband business?",["₹453 crore","₹800 crore","₹2,204 crore","₹1,500 crore"],3],
["India and Belarus will ramp up industrial and defence ties, focusing on agriculture machinery and which technology?",["Drones","Semiconductors","Shipbuilding","Satellites"],0],
["Oravel (Oyo) reported a net profit of how much in FY26?",["₹245 crore","₹678 crore","₹994 crore","₹9,358 crore"],2],
["The Siang Upper Multipurpose Project, facing local opposition, is located in which state and has what capacity?",["Assam, 11,000 MW","Sikkim, 2,000 MW","Arunachal Pradesh, 11,000 MW","Arunachal Pradesh, 6,000 MW"],2],
["Oyo is eyeing an IPO in which quarter, at what valuation?",["Q4, about $2.3 billion","Q1, about $5 billion","Q2, about $1 billion","Q3, about $2.3 billion"],0],
["Who is the Chief Justice of India that said citizens may criticise decisions but should not target institutions?",["BR Gavai","DY Chandrachud","Surya Kant","Sanjiv Khanna"],2],
["Pernod Ricard's board may meet in India in which month to discuss a potential IPO?",["December","January","March","June"],1],
["Which Pakistani federal minister attended the SCO Civilisational Forum in Delhi?",["Ishaq Dar","Musadik Malik","Khawaja Asif","Ahsan Iqbal"],1],
["CII proposed allowing up to what percentage of foreign investment in state-run banks?",["26%","49%","74%","100%"],1],
["Who called on Nepal PM Balen Shah on Sunday?",["Rajnath Singh","Amit Shah","S Jaishankar","Nirmala Sitharaman"],2],
["FPIs have been net buyers of Indian equities for how many consecutive sessions (as of November)?",["5","8","13","189"],2],
["What does VVP, under which Arunachal border villages saw population rise (per Amit Shah), stand for?",["Vibrant Villages Programme","Village Value Plan","Viksit Village Project","Vital Villages Policy"],0],
["Which soft drink is Coca-Cola bringing back after 26 years?",["Gold Spot","Thums Up","Limca","Maaza"],0]];
const KEY="etquiz.v1";let S={q:DEFAULT_Q,ans:{}},cur=0,tm=null,ac=null,tick=null;
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.q&&d.q.length==18)S=d}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const info=i=>({g:Math.floor(i/6),m:Math.floor(i%6/2),t:i%2?"Business Affairs":"International / Indian Politics"});
const pts=(i)=>{const a=S.ans[i];if(a===undefined)return null;if(a===-1)return 0;return a===S.q[i][2]?2:-1};
const $=id=>document.getElementById(id),L="ABCD";

/* sounds (generated with Web Audio, no files needed) */
function actx(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=="suspended")ac.resume();return ac}
function beep(f,d,type="square",v=.25){const a=actx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function buzzer(){beep(130,1.1,"sawtooth",.5);beep(135,1.1,"square",.3)}
function stopTimer(){clearInterval(tm);clearInterval(tick);tm=tick=null}

function startTimer(){
 stopTimer();actx();let phase="read",end=Date.now()+5000,n=0;
 const clock=$("clock"),ph=$("phase");$("start").disabled=true;
 const upd=()=>{clock.className=phase=="read"?"read":"ans";ph.textContent=phase=="read"?"Reading time":"Answer now"};upd();
 tick=setInterval(()=>{beep(n++%2?900:1200,.05,"square",.15)},500);
 tm=setInterval(()=>{let r=end-Date.now();
  if(r<=0){if(phase=="read"){phase="ans";end=Date.now()+5000;r=5000;upd();beep(1500,.25,"sine",.3)}
   else{stopTimer();clock.textContent="0";clock.className="end";ph.textContent="Time up!";buzzer();$("start").disabled=false;return}}
  clock.textContent=Math.ceil(r/1000)},100);
 clock.textContent=5;
}
function mark(i,v){S.ans[i]=v;save();stopTimer();render()}

function render(){
 const i=cur,{g,m,t}=info(i),[q,o,c]=S.q[i],a=S.ans[i],done=a!==undefined;
 $("dots").innerHTML=S.q.map((_,k)=>{const p=pts(k);return`<button class="${k==i?"cur ":""}${p==2?"c":p==-1?"w":p===0?"u":""}" onclick="go(${k})">${k+1}</button>`}).join("");
 const p=pts(i);
 $("slide").innerHTML=`<div class="meta"><span class="pill">Question ${i+1} / 18</span><span class="pill">${GROUPS[g][0]}</span><span class="pill who">${GROUPS[g][1][m]}</span><span class="pill">${t}</span></div>
 <h2 class="q">${esc(q)}</h2><div class="opts">${o.map((x,k)=>`<button class="opt ${done&&k==c?"right":""} ${done&&a==k&&k!=c?"wrong":""} ${a==k?"picked":""}" onclick="mark(${i},${k})"><b>${L[k]}</b>${esc(x)}</button>`).join("")}</div>
 <div class="bar"><div class="timer"><div id="clock">5</div><div id="phase">Ready</div><button class="btn pri" id="start" onclick="startTimer()">▶ Start timer</button></div>
 <div><button class="btn" onclick="mark(${i},-1)">Unanswered (0)</button> ${done?`<button class="btn" onclick="clr(${i})">Clear</button>`:""}</div></div>
 <div class="bar"><button class="btn" onclick="go(${i-1})" ${i==0?"disabled":""}>← Previous</button>
 <span class="res ${p>0?"pos":p<0?"neg":""}">${done?(p>0?"Correct +2":p<0?"Wrong −1":"Unanswered 0")+" · "+GROUPS[g][1][m]:"Not marked yet"}</span>
 <button class="btn" onclick="go(${i+1})" ${i==17?"disabled":""}>Next →</button></div>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(k){if(k<0||k>17)return;stopTimer();cur=k;render()}
function clr(i){delete S.ans[i];save();render()}

function score(){
 $("vS").innerHTML=GROUPS.map(([gn,ms],g)=>{let gt=0;
  const rows=ms.map((n,m)=>{let t=0;const cells=[0,1].map(k=>{const i=g*6+m*2+k,p=pts(i);if(p!==null)t+=p;return`<td>${p===null?"–":(p>0?"+"+p:p)}</td>`}).join("");gt+=t;return`<tr><td><b>${n}</b></td>${cells}<td><b class="${t>0?"pos":t<0?"neg":""}">${t}</b></td></tr>`}).join("");
  return`<div class="grp"><h2><span>${gn}</span><span>Total: ${gt}</span></h2><table><tr><th>Member</th><th>Politics/Internation affairs Q</th><th>Business Q</th><th>Total</th></tr>${rows}</table></div>`}).join("")
  +`<button class="btn" onclick="if(confirm('Clear all marks?')){S.ans={};save();score()}">Reset all scores</button>`;
}
function edit(){
 $("vE").innerHTML=`<p style="font-family:system-ui">Edit the questions, options and the correct answer, then press Save. Order is fixed: for each member, Politics question then Business question.</p>`+
 S.q.map(([q,o,c],i)=>{const{g,m,t}=info(i);return`<div class="ed"><b>Q${i+1} · ${GROUPS[g][0]} · ${GROUPS[g][1][m]} · ${t}</b>
 <textarea rows="2" id="eq${i}">${esc(q)}</textarea>${o.map((x,k)=>`<label><input type="radio" name="c${i}" value="${k}" ${k==c?"checked":""}><input type="text" id="eo${i}_${k}" value="${esc(x)}"></label>`).join("")}</div>`}).join("")+
 `<button class="btn pri" onclick="saveEd()">Save changes</button> <button class="btn" onclick="if(confirm('Restore original questions?')){S.q=DEFAULT_Q;save();edit()}">Restore defaults</button>
 <button class="btn" onclick="exp()">Export JSON</button> <button class="btn" onclick="$('imp').click()">Import JSON</button><input id="imp" type="file" accept=".json" class="hide" onchange="imp(this)">`;
}
function saveEd(){S.q=S.q.map((_,i)=>[$("eq"+i).value,[0,1,2,3].map(k=>$(`eo${i}_${k}`).value),+document.querySelector(`input[name=c${i}]:checked`).value]);save();alert("Questions saved.")}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S.q,null,1)],{type:"application/json"}));a.download="quiz-questions.json";a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.length!=18)throw 0;S.q=d;save();edit()}catch(e){alert("Invalid file: need 18 questions.")}};r.readAsText(f.files[0])}

function tab(t){stopTimer();["Q","S","E"].forEach(k=>{$("v"+k).classList.toggle("hide",k!=t);$("t"+k).classList.toggle("on",k==t)});if(t=="Q")render();if(t=="S")score();if(t=="E")edit()}
$("tQ").onclick=()=>tab("Q");$("tS").onclick=()=>tab("S");$("tE").onclick=()=>tab("E");
document.addEventListener("keydown",e=>{if($("vQ").classList.contains("hide")||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key=="ArrowRight")go(cur+1);if(e.key=="ArrowLeft")go(cur-1)});
render();
</script></body></html>
